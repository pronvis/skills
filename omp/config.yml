modelRoles:
  default: anthropic/claude-opus-5-5:xhigh
  task: anthropic/claude-opus-5-5:xhigh
  smol: anthropic/claude-sonnet-5:xhigh
  slow: anthropic/claude-fable-5-1:xhigh
  commit: openai-codex/gpt-6-sol:medium
  tiny: anthropic/claude-sonnet-5:medium
  plan: anthropic/claude-fable-5-1:xhigh
  vision: anthropic/claude-fable-5-1:xhigh
  review: anthropic/claude-opus-5-5:xhigh
  advisor: openai-codex/gpt-6-sol:xhigh
  fable: anthropic/claude-fable-5-1:xhigh
  opus: anthropic/claude-opus-5-5:xhigh
  sonnet: anthropic/claude-sonnet-5:xhigh
  haiku: anthropic/claude-haiku-5:xhigh
  gpt-astra: openai-codex/gpt-6-astra:xhigh
  gpt-sol: openai-codex/gpt-6-sol:xhigh
  gpt-terra: openai-codex/gpt-5.6-terra:xhigh
  gpt-luna: openai-codex/gpt-6-luna:xhigh
  kimi-k3: kimi-code/k3
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
statusLine:
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - path
    - git
    - pr
    - session
    - subagents
  rightSegments:
    - session_name
    - token_in
    - token_out
    - cache_read
    - cache_write
    - token_rate
    - cost
    - context_pct
    - usage
    - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
task:
  enableLsp: true
  showResolvedModelBadge: true
  agentModelOverrides:
    fixer:
      - "@opus"
      - "@gpt-sol"
    reviewer:
      - "@gpt-sol"
      - "@opus"
    scout:
      - "@gpt-terra"
      - "@opus"
    task:
      - "@fable"
      - "@gpt-sol"
      - "@opus"
    poteto-agent:
      - "@opus"
      - "@gpt-sol"
  maxRecursionDepth: 3
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: never
extensions:
  - ~/bin/scripts/agents/omp-hook.mjs
dev:
  autoqaConsent: granted
cycleOrder:
  - smol
  - default
  - slow
  - gpt-sol
  - gpt-astra
  - kimi-k3
extendedContext: true
skills:
  customDirectories:
    - ~/it/skills/skills
    - ./skills
externalThinking: false
edit:
  mode: hashline
github:
  enabled: true
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
browser:
  relay: true
